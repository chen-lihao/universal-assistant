server:
  port: 8080

# application.yml
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${ASSISTANT_DB_URL:jdbc:postgresql://localhost:5432/universal_assistant}
    username: ${ASSISTANT_DB_USERNAME:assistant}
    password: ${ASSISTANT_DB_PASSWORD:assistant}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:missing-api-key}
      embedding:
        options:
          model: ${ASSISTANT_EMBEDDING_MODEL:text-embedding-v3}
          dimensions: ${ASSISTANT_EMBEDDING_DIMENSIONS:1024}

assistant:
  chat:
    max-tokens: ${ASSISTANT_CHAT_MAX_TOKENS:2400}
  agent:
    max-steps: ${ASSISTANT_AGENT_MAX_STEPS:6}
    reflection-limit: ${ASSISTANT_AGENT_REFLECTION_LIMIT:1}
  memory:
    enabled: ${ASSISTANT_MEMORY_ENABLED:true}
    retrieve-limit: ${ASSISTANT_MEMORY_RETRIEVE_LIMIT:5}
  context:
    max-characters: ${ASSISTANT_CONTEXT_MAX_CHARACTERS:28000}
  rag:
    enabled: ${ASSISTANT_RAG_ENABLED:true}
    retrieve-limit: ${ASSISTANT_RAG_RETRIEVE_LIMIT:5}
    chunk-size: ${ASSISTANT_RAG_CHUNK_SIZE:900}
    chunk-overlap: ${ASSISTANT_RAG_CHUNK_OVERLAP:120}
  skills:
    enabled: ${ASSISTANT_SKILLS_ENABLED:true}
    max-active: ${ASSISTANT_SKILLS_MAX_ACTIVE:2}
