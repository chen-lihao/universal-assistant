spring:
  datasource:
    url: jdbc:h2:mem:universal_assistant_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  ai:
    dashscope:
      api-key: test-api-key
      agent:
        api-key: test-api-key

assistant:
  rag:
    enabled: false
