services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: universal-assistant-postgres
    environment:
      POSTGRES_DB: universal_assistant
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
    ports:
      - "5432:5432"
    volumes:
      - universal-assistant-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d universal_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  universal-assistant-postgres-data:
